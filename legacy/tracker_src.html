<title>Angels of Death Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#0C0F11; --panel:#14181B; --panel2:#1B2126;
  --line:#262E34; --line2:#333D45;
  --ink:#E9EDEF; --dim:#96A2AA; --faint:#66727A;
  --go:#5FC08C; --go-bg:#12251C;
  --live:#E6A94A; --live-bg:#2A2010;
  --cold:#6E7C85;
  --cool:#7FB2D9;
  --hot:#E2685F;
  --f-cond:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
  --f-sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-sans); font-size:15px; line-height:1.45;
  padding-inline:14px; padding-block:0 40px;
  -webkit-text-size-adjust:100%;
}
.app{max-width:560px;margin-inline:auto;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left;}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px;}
.lbl{font-family:var(--f-cond);font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);}

/* ---- top bar ---- */
.bar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding-block:12px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:stretch;gap:8px;
}
.gauge{
  flex:1 1 0;background:var(--panel);border:1px solid var(--line);
  display:grid;grid-template-columns:40px 1fr 40px;align-items:center;
}
.gauge .mid{text-align:center;padding-block:5px;}
.gauge .v{font-family:var(--f-mono);font-weight:600;font-size:23px;line-height:1.05;display:block;}
.gauge .k{font-family:var(--f-cond);font-weight:600;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);}
.gauge button{height:100%;min-height:48px;color:var(--dim);font-size:19px;text-align:center;}
.gauge button:hover{background:var(--panel2);color:var(--ink);}
.gauge button:disabled{opacity:.25;cursor:default;}
#cpGauge .v{color:var(--cool);}
.mini{display:flex;flex-direction:column;gap:4px;}
.minibtn{
  flex:1;background:var(--panel);border:1px solid var(--line);padding:0 9px;
  font-family:var(--f-cond);font-weight:600;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);text-align:center;min-width:58px;
}
.minibtn:hover{background:var(--panel2);color:var(--ink);}
.minibtn:disabled{opacity:.3;cursor:default;}

/* ---- context chips ---- */
.ctx{display:flex;flex-wrap:wrap;gap:6px;padding-block:12px 4px;}
.chip{
  white-space:nowrap;padding:9px 13px;border:1px solid var(--line2);
  background:var(--panel);color:var(--dim);
  font-family:var(--f-cond);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}

/* ---- prompts ---- */
.prompts{display:flex;flex-direction:column;gap:7px;padding-block:12px 0;}
.prompt{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;
  background:var(--live-bg);border:1px solid var(--live);border-left-width:3px;padding:11px 12px;
}
.prompt .src{font-family:var(--f-cond);font-weight:700;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--live);display:block;margin-bottom:3px;}
.prompt p{margin:0;font-size:14.5px;line-height:1.4;}
.prompt .x{color:var(--faint);font-size:17px;padding:2px 4px;text-align:center;}
.prompt .x:hover{color:var(--ink);}

/* ---- stat panel ---- */
.stats{border:1px solid var(--line);background:var(--panel);margin-top:14px;}
.oprow{display:flex;flex-wrap:wrap;gap:5px;padding:9px;border-bottom:1px solid var(--line);}
.opchip{
  white-space:nowrap;padding:6px 10px;border:1px solid var(--line2);background:var(--panel2);
  font-family:var(--f-cond);font-weight:600;font-size:11.5px;color:var(--dim);
}
.opchip[aria-pressed="true"]{background:var(--cool);color:var(--bg);border-color:var(--cool);}
.opchip.down{text-decoration:line-through;opacity:.45;}
.opchip{display:flex;align-items:center;gap:6px;}
.glyph{width:15px;height:15px;flex:none;display:block;}
.opchip[aria-pressed="true"] .glyph{color:var(--bg)!important;}
.ophead{display:flex;align-items:center;gap:11px;padding:10px 11px;border-bottom:1px solid var(--line);}
.ophead .badge{width:38px;height:38px;flex:none;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;overflow:hidden;}
.ophead .badge .glyph{width:22px;height:22px;}
.ophead .badge img{width:100%;height:100%;object-fit:cover;}
.ophead .who{font-family:var(--f-cond);font-weight:700;font-size:15.5px;line-height:1.15;}
.ophead .role{font-family:var(--f-cond);font-weight:600;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
.statline{display:flex;border-bottom:1px solid var(--line);}
.statline div{flex:1 1 0;text-align:center;padding:9px 4px;}
.statline div+div{border-left:1px solid var(--line);}
.statline .v{font-family:var(--f-mono);font-weight:600;font-size:17px;display:block;}
.statline .k{font-family:var(--f-cond);font-weight:600;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);}
.wtab{width:100%;border-collapse:collapse;font-size:13.5px;}
.wtab th{font-family:var(--f-cond);font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);}
.wtab th.n,.wtab td.n{text-align:center;width:44px;}
.wtab td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
.wtab tr:last-child td{border-bottom:0;}
.wtab td.n{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;}
.wtab .wr{display:block;font-size:11.5px;color:var(--faint);line-height:1.35;margin-top:1px;}
.opfoot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 9px;border-top:1px solid var(--line);}
.opfoot .ab{font-size:12px;color:var(--dim);}
.opfoot button{font-family:var(--f-cond);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line2);padding:5px 9px;white-space:nowrap;}
.opfoot button:hover{color:var(--hot);border-color:var(--hot);}

/* ---- lists ---- */
section{margin-top:22px;}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;}
.head h2{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.15em;text-transform:uppercase;margin:0;}
.head .ct{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);}
#usable .head h2{color:var(--go);}
#running .head h2{color:var(--live);}
#spent .head h2{color:var(--cold);}
.sub{font-family:var(--f-cond);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px;}

.card{width:100%;display:block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);padding:10px 12px 11px;margin-bottom:7px;}
.card:hover{background:var(--panel2);}
.card .kind{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-cond);font-weight:600;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:4px;}
.card .now{color:var(--go);}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.card .nm{font-family:var(--f-cond);font-weight:700;font-size:16px;}
.card .cost{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);white-space:nowrap;}
.card .tx{display:block;font-size:13px;color:var(--dim);line-height:1.4;margin-top:3px;}
.card .cond{display:block;font-size:11.5px;color:var(--cool);line-height:1.35;margin-top:5px;}
.card .meta{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);margin-top:6px;}
#usable .card{border-left-color:var(--go);}
#usable .card .cost{color:var(--go);}
#running .card{border-left-color:var(--live);}
#running .card .nm{color:var(--live);}
#running .card.on{background:var(--live-bg);}
#running .card.off{opacity:.5;}
.card.locked{border-left-color:var(--hot);opacity:.6;cursor:default;}
.card.locked:hover{background:var(--panel);}
.card.locked .cost{color:var(--hot);}
#spent .card{opacity:.45;cursor:default;border-left-color:var(--cold);}
#spent .card:hover{background:var(--panel);}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.opt{padding:7px 11px;border:1px solid var(--go);color:var(--go);font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;}
.opt:hover{background:var(--go);color:var(--bg);}
.opt small{display:block;font-family:var(--f-sans);font-weight:400;font-size:10.5px;letter-spacing:0;text-transform:none;opacity:.75;}
.opt b{display:block;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:0;text-transform:none;margin-top:2px;}
.unver{display:inline-block;border:1px solid var(--hot);color:var(--hot);font-family:var(--f-cond);font-weight:600;font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:2px 6px;margin-top:6px;}
.unver+.cond{color:var(--hot);}
.freepill{display:inline-block;border:1px solid var(--cool);color:var(--cool);font-family:var(--f-cond);font-weight:600;font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:2px 6px;margin-top:6px;}
.empty{font-size:13px;color:var(--faint);font-style:italic;padding:2px 0;}

/* ---- summary ---- */
.summary{border:1px solid var(--hot);border-left-width:3px;background:#26120F;padding:12px;margin-top:14px;}
.summary h3{font-family:var(--f-cond);font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--hot);margin:0 0 6px;}
.summary ul{margin:0;padding-left:17px;font-size:13.5px;color:var(--dim);}
.summary button{margin-top:9px;font-family:var(--f-cond);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}

/* ---- setup ---- */
details{margin-top:26px;border-top:1px solid var(--line);padding-top:12px;}
summary{font-family:var(--f-cond);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);cursor:pointer;list-style:none;}
summary::-webkit-details-marker{display:none;}
summary::before{content:"+ ";}
details[open] summary::before{content:"– ";}
.setgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
.toggle{padding:7px 11px;border:1px solid var(--line2);background:var(--panel);color:var(--faint);font-family:var(--f-cond);font-weight:600;font-size:11.5px;}
.toggle{display:flex;align-items:center;gap:6px;}
.toggle[aria-pressed="true"]{border-color:var(--cool);color:var(--cool);background:var(--panel2);}
.counter{display:flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);padding:0 4px 0 9px;font-family:var(--f-cond);font-weight:600;font-size:11.5px;color:var(--dim);}
.counter .cname{padding-block:7px;}
.counter .cnum{font-family:var(--f-mono);font-size:13px;color:var(--ink);min-width:14px;text-align:center;}
.counter button{color:var(--dim);font-size:16px;padding:4px 8px;text-align:center;}
.counter button:hover{color:var(--ink);}
.counter button:disabled{opacity:.25;cursor:default;}
.setnote{font-size:12px;color:var(--faint);margin:14px 0 0;line-height:1.5;}
.danger{margin-top:12px;color:var(--hot);font-family:var(--f-cond);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>

<div class="app">
  <div class="bar">
    <div class="gauge" id="tpGauge">
      <button data-act="tp-" aria-label="Previous turning point">−</button>
      <div class="mid"><span class="v" id="tpV">1</span><span class="k">Turn Pt</span></div>
      <button data-act="tp+" aria-label="Next turning point">+</button>
    </div>
    <div class="gauge" id="cpGauge">
      <button data-act="cp-" aria-label="Spend a command point">−</button>
      <div class="mid"><span class="v" id="cpV">2</span><span class="k">Command</span></div>
      <button data-act="cp+" aria-label="Gain a command point">+</button>
    </div>
    <div class="mini">
      <button class="minibtn" data-act="undo" id="undoBtn">Undo</button>
      <button class="minibtn" data-act="tp-reset">Reset TP</button>
    </div>
  </div>

  <div class="ctx" id="ctx"></div>
  <div class="prompts" id="prompts"></div>
  <div id="summary"></div>
  <div class="stats" id="stats"></div>

  <section id="usable">
    <div class="head"><h2>Usable now</h2><span class="ct" id="usableCt"></span></div>
    <div id="usableList"></div>
  </section>

  <section id="running">
    <div class="head"><h2>Running</h2><span class="ct" id="runningCt"></span></div>
    <div id="runningList"></div>
  </section>

  <section id="spent">
    <div class="head"><h2>Spent this turning point</h2><span class="ct" id="spentCt"></span></div>
    <div id="spentList"></div>
  </section>

  <details id="setup">
    <summary>Setup — roster &amp; equipment</summary>
    <p class="lbl" style="margin:14px 0 0">Leader <span id="rosterCount"></span></p>
    <div class="setgrid" id="leaderSet"></div>
    <p class="lbl" style="margin:16px 0 0">Specialists — one of each</p>
    <div class="setgrid" id="specSet"></div>
    <p class="lbl" style="margin:16px 0 0">Warriors — take as many as you like</p>
    <div class="setgrid" id="warriorSet"></div>
    <p class="lbl" style="margin:16px 0 0">Primary chapter tactic</p>
    <div class="setgrid" id="tacticPrimary"></div>
    <p class="lbl" style="margin:16px 0 0">Secondary chapter tactic</p>
    <div class="setgrid" id="tacticSecondary"></div>
    <div id="veteranBlock" hidden>
      <p class="lbl" style="margin:16px 0 0">Extra tactic <span id="veteranWho"></span></p>
      <div class="setgrid" id="tacticExtra"></div>
    </div>
    <p class="lbl" style="margin:16px 0 0">Faction equipment taken</p>
    <div class="setgrid" id="equipSet"></div>
    <p class="setnote" id="verifyNote"></p>
    <button class="danger" data-act="reset">Reset whole game</button>
  </details>
</div>

<script>
const DATA = /*__AOD_DATA__*/{};

const CTX_TRIGGERS = {
  "strategy_phase":    ["strategy_phase","turning_point.start"],
  "activation.own":    ["activation.start"],
  "combat.shoot":      ["combat.shoot.before_roll","combat.shoot.after_roll"],
  "combat.fight":      ["combat.fight.before_roll","combat.fight.after_roll"],
  "combat.retaliate":  ["combat.retaliate.before_roll","combat.retaliate.after_roll"],
  "defence.shooting":  ["defence.shooting.before_roll","defence.shooting.after_roll"],
  "counteract":        ["counteract.available"]
};
const KIND = {
  strategy_ploy:"Strategy ploy",
  firefight_ploy:"Firefight ploy",
  equipment:"Equipment",
  faction_rule:"Faction rule",
  operative_ability:"Ability",
  chapter_tactic:"Chapter tactic"
};
const EXPIRY = {
  end_of_turning_point:"expires end of turning point",
  this_sequence:"expires end of this sequence",
  this_activation:"expires end of this activation",
  this_counteraction:"expires end of this counteraction",
  battle:"lasts all battle"
};
/* original geometric marks — no third-party artwork */
const ICONS = {
  laurel:    '<path d="M6 19c-3.2-4-2.4-9.6 1.8-12.6M18 19c3.2-4 2.4-9.6-1.8-12.6"/><path d="M12 6.5l1.7 3.4 3.8.5-2.8 2.7.7 3.7L12 15.1 8.6 16.8l.7-3.7-2.8-2.7 3.8-.5z"/>',
  chevron2:  '<path d="M4 10.5l8-5 8 5M4 17l8-5 8 5"/>',
  rifle:     '<path d="M3 13h12l3-3h3M6.5 13v4M12 10v3"/>',
  launcher:  '<path d="M3 11.5h11l3-3h3M6.5 11.5v3"/><circle cx="11" cy="17" r="3"/>',
  chainsword:'<path d="M4.5 20l9.5-9.5 3 3L7.5 23z" transform="translate(0,-3)"/><path d="M14 7.5l2.5-2.5 3.5 3.5-2.5 2.5"/><path d="M6.5 14.5l1.5 1.5M9.5 11.5l1.5 1.5"/>',
  grenade:   '<circle cx="12" cy="14.5" r="5.5"/><path d="M10 7.5h4v2h-4zM12 5.5v2M15 8l2.5-2.5"/>',
  heavy:     '<path d="M3 10.5h12v2.5H3zM3 15h12v2.5H3zM15 11.7h5M15 16.2h5M6.5 17.5v3"/>',
  crosshair: '<circle cx="12" cy="12" r="7"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/>'
};
function glyph(o, cls){
  if (o.photo) return `<img src="${o.photo}" alt="">`;
  return `<svg class="glyph ${cls||""}" viewBox="0 0 24 24" fill="none" stroke="${o.accent||"#8FA5B5"}"
    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[o.icon] || ICONS.rifle}</svg>`;
}

const SHORT = new Set(["instant","this_sequence","this_activation","this_counteraction"]);
const byId = id => DATA.effects.find(e => e.id === id);
/* roster entries are instances: "captain" or "intercessor_warrior#2" */
const typeOf = inst => String(inst).split("#")[0];
const opById = inst => DATA.operatives.find(o => o.id === typeOf(inst));
const LEADERS = DATA.operatives.filter(o => o.leader);
const DEFAULT_ROSTER = ["captain","intercessor_gunner","heavy_intercessor_gunner",
                        "eliminator_sniper","intercessor_warrior#1","assault_intercessor_warrior#1"];

/* ---------------- event log → fold ---------------- */
let events = [];

function blank(){
  return { tp:1, cp:2, ctx:"strategy_phase",
    roster:DEFAULT_ROSTER.slice(), op:DEFAULT_ROSTER[0], dead:{}, equip:{},
    tactics:{ primary:null, secondary:null, extra:null },
    active:[], used:{}, usedBattle:{}, usedTp:{}, dismissed:{}, surfaced:{}, lastSummary:null, seq:0 };
}

function clearTp(s){ s.active=[]; s.used={}; s.usedTp={}; s.dismissed={}; s.surfaced={}; s.ctx="strategy_phase"; }

function apply(s, ev){
  const p = ev.p || {};
  switch(ev.t){
    case "CTX":
      s.ctx = p.ctx;
      s.active = s.active.filter(a => !SHORT.has(byId(a.id).duration));
      break;
    case "CP": s.cp = Math.max(0, s.cp + p.d); break;
    case "TP_NEXT": {
      const orphans = s.active
        .filter(a => { const e = byId(a.id); return e.duration === "end_of_turning_point" && !s.surfaced[a.id]; })
        .map(a => byId(a.id).name);
      s.lastSummary = orphans.length ? { tp:s.tp, names:orphans } : null;
      s.tp += 1; s.cp += 1; clearTp(s);
      break;
    }
    case "TP_PREV": if (s.tp > 1){ s.tp -= 1; s.lastSummary = null; } break;
    case "TP_RESET": clearTp(s); s.lastSummary = null; break;
    case "ACTIVATE": {
      const e = byId(p.id); if (!e) break;
      const q = quote(s, e, p.opt);
      s.cp = Math.max(0, s.cp - q.cp);
      s.used[e.id] = s.tp;
      if (q.key && q.once === "battle") s.usedBattle[q.key] = true;
      if (q.key && q.once === "turning_point") s.usedTp[q.key] = s.tp;
      if (e.changesOptionOf){
        const t = s.active.find(a => a.id === e.changesOptionOf);
        if (t) t.opt = p.opt;
      } else if (e.duration !== "instant"){
        s.active.push({ id:e.id, opt:p.opt || null, tp:s.tp, seq:++s.seq });
      }
      break;
    }
    case "END": s.active = s.active.filter(a => a.id !== p.id); break;
    case "USE_BATTLE": s.usedBattle[p.id] = true; break;
    case "DISMISS": s.dismissed[p.k] = true; break;
    case "SURFACE": s.surfaced[p.id] = true; break;
    case "OP": s.op = p.id; break;
    case "DOWN": s.dead[p.id] = !s.dead[p.id]; break;
    case "LEADER": {
      const had = s.roster.some(x => typeOf(x) === p.id);
      s.roster.filter(x => LEADERS.some(l => l.id === typeOf(x))).forEach(x => delete s.dead[x]);
      s.roster = s.roster.filter(x => !LEADERS.some(l => l.id === typeOf(x)));
      if (!had) s.roster.unshift(p.id);
      if (!s.roster.includes(s.op)) s.op = s.roster[0] || null;
      break;
    }
    case "ROSTER":
      s.roster = s.roster.includes(p.id) ? s.roster.filter(x => x !== p.id) : s.roster.concat(p.id);
      if (!s.roster.includes(s.op)) s.op = s.roster[0] || null;
      break;
    case "COUNT": {
      const mine = s.roster.filter(x => typeOf(x) === p.id);
      if (p.d > 0){
        let n = 1; while (s.roster.includes(p.id + "#" + n)) n++;
        s.roster = s.roster.concat(p.id + "#" + n);
      } else if (mine.length){
        const drop = mine[mine.length - 1];
        s.roster = s.roster.filter(x => x !== drop);
        delete s.dead[drop];
      }
      if (!s.roster.includes(s.op)) s.op = s.roster[0] || null;
      break;
    }
    case "EQUIP": s.equip[p.id] = !s.equip[p.id]; break;
    case "TACTIC": {
      const on = s.tactics[p.slot] === p.id;
      s.tactics[p.slot] = on ? null : p.id;
      if (!on) for (const other of ["primary","secondary","extra"])
        if (other !== p.slot && s.tactics[other] === p.id) s.tactics[other] = null;
      break;
    }
    case "CLEAR_SUMMARY": s.lastSummary = null; break;
  }
  return s;
}
const fold = list => list.reduce(apply, blank());

/* an effect only exists if its operative is on the table */
function present(s, e){
  if (e.kind === "equipment" && !s.equip[e.id]) return false;
  if (!e.requiresOperative) return true;
  return s.roster.some(x => typeOf(x) === e.requiresOperative && !s.dead[x]);
}

/* every cost override that could apply to this effect right now */
function routes(s, e, optId){
  const out = [];
  for (const p of DATA.effects){
    if (!present(s, p)) continue;
    if (p.kind === "equipment" && s.used[p.id] === s.tp) continue;
    const list = p.costOverrides || (p.costOverride ? [p.costOverride] : []);
    for (const ov of list){
      if (ov.effect && ov.effect !== e.id) continue;
      if (ov.kind && ov.kind !== e.kind) continue;
      if (ov.excludes && ov.excludes.includes(e.id)) continue;
      if (ov.options && optId && !ov.options.includes(optId)) continue;
      // some discounts only apply when the ploy is about a particular operative
      const wrongOperative = ov.selectedIs && typeOf(s.op) !== ov.selectedIs;
      // a shared group means one use covers every option of that ability
      const scope = ov.group || (e.id + "|" + (ov.options ? (optId || "*") : "*"));
      const key = ov.once_per ? p.id + "|" + scope : null;
      if (key && ov.once_per === "battle" && s.usedBattle[key]) continue;
      if (key && ov.once_per === "turning_point" && s.usedTp[key] === s.tp) continue;
      out.push({ cp:ov.cp, condition:ov.condition, from:p.name, options:ov.options || null,
                 key, once:ov.once_per || null, disputed:!!p.disputed, inactive:!!wrongOperative,
                 needs:ov.selectedIs || null });
    }
  }
  return out;
}

/* the price to show, and why. option-specific routes do not move the headline. */
function quote(s, e, optId){
  const all = routes(s, e, optId);
  const firm = all.filter(r => !r.inactive && (!r.options || (optId && r.options.includes(optId))));
  const maybe = all.filter(r => r.inactive || (r.options && !optId));
  let best = { cp:e.cost.cp, condition:null, from:null, key:null, once:null, maybe };
  for (const r of firm) if (r.cp < best.cp) best = { ...r, maybe };
  return best;
}

function derive(s){
  const triggers = CTX_TRIGGERS[s.ctx] || [];
  const activeIds = new Set(s.active.map(a => a.id));
  const usable = [], spent = [], running = [];

  for (const e of DATA.effects){
    if (!present(s, e)) continue;

    if (e.alwaysOn){
      if (e.once_per === "battle" && s.usedBattle[e.id]) continue;
      running.push({ e, opt:null, always:true });
      continue;
    }
    const a = s.active.find(x => x.id === e.id);
    if (a){ running.push({ e, opt:a.opt }); continue; }
    if (e.once_per === "turning_point" && s.used[e.id] === s.tp){ spent.push({ e }); continue; }
    const wins = e.windows || [e.window];
    if (!(wins.includes("any") || wins.includes(s.ctx))) continue;
    if (e.requires && e.requires.activeEffect && !activeIds.has(e.requires.activeEffect)) continue;

    const q = quote(s, e, null);
    usable.push({ e, q, afford: s.cp >= q.cp });
  }

  for (const slot of ["primary","secondary","extra"]){
    const t = DATA.chapterTactics.find(x => x.id === s.tactics[slot]);
    if (!t) continue;
    running.push({ always:true, opt:null, slot, e:{
      id:"tactic." + t.id, name:t.name, kind:"chapter_tactic", cost:{ cp:0 },
      duration:"battle", text:t.text, remind_at:t.remind_at, prompts:{ "*":t.prompt } } });
  }

  const fires = r => {
    const opt = r.opt ? (r.e.options || []).find(o => o.id === r.opt) : null;
    const at = (opt && opt.remind_at) || r.e.remind_at || [];
    return at.some(t => triggers.includes(t));
  };
  running.forEach(r => { r.now = fires(r); });

  const prompts = [];
  for (const r of running){
    if (!r.now) continue;
    const opt = r.opt ? (r.e.options || []).find(o => o.id === r.opt) : null;
    const key = r.e.id + "|" + s.tp + "|" + s.ctx;
    if (s.dismissed[key]) continue;
    const text = opt ? opt.prompt
      : (r.e.prompts && (r.e.prompts[triggers.find(t => r.e.prompts[t])] || r.e.prompts["*"])) || r.e.text;
    prompts.push({ id:r.e.id, name:r.e.name + (opt ? " · " + opt.name : ""), text, key, paid:!r.always });
  }

  usable.sort((x,y) => Number(y.afford) - Number(x.afford) || x.e.kind.localeCompare(y.e.kind));
  running.sort((x,y) => Number(y.now) - Number(x.now));
  return { usable, running, spent, prompts };
}

/* ---------------- render ---------------- */
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
let openOpts = null;

function kindLabel(e, slot){
  let k = KIND[e.kind] || e.kind;
  if (e.universal) k = "Universal " + k.toLowerCase();
  if (slot) k += " · " + slot;
  if (e.requiresOperative){
    const o = opById(e.requiresOperative);
    if (o) k += " · " + o.name;
  }
  return k;
}

function render(){
  const s = fold(events);
  const d = derive(s);

  $("tpV").textContent = s.tp;
  $("cpV").textContent = s.cp;
  $("undoBtn").disabled = events.length === 0;
  $("tpGauge").querySelector('[data-act="tp-"]').disabled = s.tp <= 1;

  $("ctx").innerHTML = DATA.vocab.contexts.map(c =>
    `<button class="chip" data-act="ctx" data-id="${c.id}" aria-pressed="${c.id === s.ctx}">${esc(c.label)}</button>`).join("");

  $("prompts").innerHTML = d.prompts.map(p => `
    <div class="prompt">
      <div><span class="src">${esc(p.name)}</span><p>${esc(p.text)}</p></div>
      <button class="x" data-act="dismiss" data-k="${esc(p.key)}" aria-label="Dismiss">×</button>
    </div>`).join("");

  const fresh = d.prompts.filter(p => p.paid && !s.surfaced[p.id]).map(p => p.id);
  if (fresh.length){ fresh.forEach(id => events.push({ t:"SURFACE", p:{ id } })); save(); }

  $("summary").innerHTML = s.lastSummary ? `
    <div class="summary">
      <h3>Turning point ${s.lastSummary.tp} — never used</h3>
      <ul>${s.lastSummary.names.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
      <button data-act="clear-summary">Dismiss</button>
    </div>` : "";

  renderStats(s);

  $("usableList").innerHTML = d.usable.length
    ? d.usable.map(u => cardUsable(u, s)).join("")
    : `<p class="empty">Nothing available in this window.</p>`;

  const now = d.running.filter(r => r.now), later = d.running.filter(r => !r.now);
  $("runningList").innerHTML =
    (now.length   ? `<p class="sub" style="color:var(--go)">Applies right now</p>` + now.map(cardRunning).join("") : "") +
    (later.length ? `<p class="sub">Active, not in this window</p>` + later.map(cardRunning).join("") : "") ||
    `<p class="empty">Nothing active.</p>`;

  $("spentList").innerHTML = d.spent.length
    ? d.spent.map(x => cardSpent(x.e)).join("")
    : `<p class="empty">Nothing spent yet.</p>`;

  $("usableCt").textContent  = d.usable.length || "";
  $("runningCt").textContent = now.length ? now.length + " now · " + d.running.length + " total" : (d.running.length || "");
  $("spentCt").textContent   = d.spent.length || "";

  const has = t => s.roster.filter(x => typeOfx) === t).length;
  $("leaderSet").innerHTML = LEADERS.map(o =>
    `<button class="toggle" data-act="leader" data-id="${o.id}" aria-pressed="${has(o.id) > 0}">${glyph(o)}${esc(o.name)}</button>`).join("");
  $("specSet").innerHTML = DATA.operatives.filter(o => !o.leader && !o.multiple).map(o =>
    `<button class="toggle" data-act="roster" data-id="${o.id}" aria-pressed="${has(o.id) > 0}">${glyph(o)}${esc(o.name)}</button>`).join("");
  $("warriorSet").innerHTML = DATA.operatives.filter(o => o.multiple).map(o => `
    <span class="counter" aria-label="${esc(o.name)}">
      <button data-act="count-" data-id="${o.id}" ${has(o.id) ? "" : "disabled"}>−</button>
      ${glyph(o)}<span class="cname">${esc(o.name)}</span><span class="cnum">${has(o.id)}</span>
      <button data-act="count+" data-id="${o.id}">+</button>
    </span>`).join("");
  const total = s.roster.length, leaders = s.roster.filter(x => opById(x) && opById(x).leader).length;
  $("rosterCount").textContent = `— ${total} of 6 selected` + (lead=== 1 ? "" : ", no leader");
  $("rosterCount").style.color = (total === 6 && leaders === 1) ? "var(--go)" : "var(--hot)";
  for (const slot of ["primary","secondary","extra"]){
    $("tactic" + slot[0].toUpperCase() + slot.slice(1)).innerHTML = DATA.chapterTactics.map(t =>
      `<button class="toggle" data-act="tactic" data-slot="${slot}" data-id="${t.id}" aria-pressed="${s.tactics[slot] === t.id}">${esc(t.name)}</button>`).join("");
  }
  const vets = s.roster.map(opById).filter(o => o && o.chapterVeteran);
  $("veteranBlock").hidden = !vets.length;
  $("veteranWho").textContent = vets.length ? "— Chapter Veteran, applies to " + vets.map(o => o.name).join(" / ") + " only" : "";
  if (!vets.length && s.tactics.extra) events.push({ t:"TACTIC", p:{ slot:"extra", id:s.tactics.extra } });
  $("equipSet").innerHTML = DATA.effects.filter(e => e.kind === "equipment").map(e =>
    `<button class="toggle" data-act="equip" data-id="${e.id}" aria-pressed="${!!s.equip[e.id]}">${esc(e.name)}</button>`).join("");

  cot flagged = DATA.effects.filter(e => e.verify && e.verify.length).length;
  $("verifyNote").innerHTML = `Read through a PDF-summarising model, not parsed from the PDF itself. ${flagged} entries carry assumptions.<br><br><b style="color:var(--hot)">Unresolved:</b><br>` +
    (DATA.meta.unresolved || []).map(u => "· " + esc(u)).join("<br>");
}

function cardUsable(u, s){
  const e = u.e, q = u.q, opts = e.options || [];
  const base = e.cost.cp, reduced = q.cp < base;
  const price = q.cp === 0 ? "Free" : q.p + " CP";
  const cost = reduced ? `${base} CP → ${price}` : price;
  const show = openOpts === e.id && opts.length;
  const maybeFree = q.maybe && q.maybe.length;
  return `
    <button class="card ${u.afford ? "" : "locked"}" data-act="${u.afford ? "use" : "none"}" data-id="${e.id}">
      <span class="kind"><span>${esc(kindLabel(e))}</span></span>
      <span class="top"><span class="nm">${esc(e.name)}</span><span class="cost">${esc(u.afford ? cost : cost + " — short")}</span></span>
      <span clatx">${esc(e.text)}</span>
      ${q.condition ? `<span class="cond">${esc(q.from)}: ${esc(q.condition)}</span>` : ""}
      ${maybeFree ? `<span class="freepill">Can be free</span>` +
        q.maybe.map(r => `<span class="cond">${esc(r.from)}${r.options ? " · " + esc(r.options.join(" / ")) : ""}: ${esc(r.condition)}${r.needs ? " — select that operative above" : ""}${r.disputed ? " — UNVERIFIED" : ""}</span>`).join("") : ""}
      ${show ? `<span class="opts">${opts.map(o => {
        const oq = quote(s, e, o.id);
        return `<span class="opt" data-act="use-opt" data-id="${e.id}" data-opt="${o.id}">${esc(o.name)}<small>${esc(o.condition)}</small><b>${oq.cp === 0 ? "free" : oq.cp + " CP"}</b></span>`;
      }).join("")}</span>` : ""}
    </button>`;
}

function cardRunning(r){
  const e = r.e;
  const opt = r.opt ? (e.options || []).find(o => o.id === r.opt) : null;
  const meta = r.always
    ? (e.once_per === "battle" ? "once per battle · not yet used" : "always on")
    : (EXPIRY[e.duraion] || e.duration);
  const stop = r.always
    ? (e.once_per === "battle" ? `<button class="cost" data-act="used-battle" data-id="${e.id}">mark used ×</button>` : "")
    : `<button class="cost" data-act="end" data-id="${e.id}">end ×</button>`;
  return `
    <div class="card ${r.now ? "on" : "off"}">
      <span class="kind"><span>${esc(kindLabel(e, r.slot))}</span>${r.now ? `<span class="now">Applies now</span>` : ""}</span>
      <span class="top"><span class="nm">${esc(e.name)}${opt ? " · " + esc(oname) : ""}</span>${stop}</span>
      <span class="tx">${esc(opt ? opt.prompt : e.text)}</span>
      ${e.disputed ? `<span class="unver">Unverified</span><span class="cond">Sources disagree on this rule — check your datacard.</span>` : ""}
      <span class="meta">${esc(meta)}</span>
    </div>`;
}

function cardSpent(e){
  return `<div class="card"><span class="kind"><span>${esc(kindLabel(e))}</span></span>
    <span class="top"><span class="nm">${esc(e.name)}</span><span class="cost">used</span></span/div>`;
}

function renderStats(s){
  const chips = s.roster.map(inst => {
    const op = opById(inst); if (!op) return "";
    let short = op.name.replace("Assault Intercessor","Asslt Int").replace("Heavy Intercessor","Hvy Int")
                       .replace("Intercessor","Int").replace("Eliminator","Elim").replace("Space Marine","SM");
    if (s.roster.filter(x => typeOf(x) === typeOf(inst)).length > 1) short += " " + inst.split("#")[1];
    return `<button class="opchip ${s.dead[inst] ? "down" : ""}" data-act="op" data-id="${inst}" aria-pressed="${inst === s.op}">${glyph(op)}${esc(short)}</button>`;
  }).join("");

  const o = opById(s.op);
  if (!o){ $("stats").innerHTML = `<div class="oprow">${chips}</div>`; return; }

  const melee = ["combat.fight","combat.retaliate"].includes(s.ctx);
  const ranged = s.ctx === "combat.shoot";
  let ws = o.weapons;
  if (melee)  ws = o.weapons.filter(w => w.type === "melee");
  if (ranged) ws = o.weapons.filter(w => w.type === "ranged");

  $("stats").innerHTML = `
    <div class="oprow">${chips}</div>
    <div class="ophead">
      <span class="badge">${glyph(o)}</span>
      <span><span class="who">${esc(o.name)}${s.roster.filter(x => typeOf(x) === typeOf(s.op)).length > 1 ? " " + String(s.op).split("#")[1] : ""}</span><br><span class="role">${esc(o.role || "Operative")}${s.dead[s.op] ? " · incapacitated" : ""}</span></span>
    </div>
    <div class="statline">
      <div><span class="v">${o.stats.apl}</span><span class="k">APL</span></div>
      <div><span class="">${esc(o.stats.move)}</span><span class="k">Move</span></div>
      <div><span class="v">${esc(o.stats.save)}</span><span class="k">Save</span></div>
      <div><span class="v">${o.stats.wounds}</span><span class="k">Wounds</span></div>
    </div>
    <table class="wtab">
      <thead><tr><th>${melee ? "Melee" : ranged ? "Ranged" : "Weapon"}</th>
      <th class="n">A</th><th class="n">${melee ? "WS" : ranged ? "BS" : "Hit"}</th><th class="n">D</th></tr></thead>
      <tbody>${ws.map(w => `<tr><td>${esc(w.name)}<span class="wr">${esc(w.rules)}</span></td>
        <td class="n">${w.atk}</td><td class="n">${esc(w.hit)}</td><td class="n">${esc(w.dmg)}</td></tr>`).join("")}
      </tbody>
    </table>
    <div class="opfoot">
      <span class="ab">${esc(o.abilities.join(" · "))}</span>
      <button data-act="down" data-id="${esc(s.op)}">${s.dead[s.op] ? "Back up" : "Incapacitated"}</button>
    </div>`;
}

/* ---------------- input ---------------- */
function push(t, p){ events.push({ t, p:p || {} }); save(); render(); }

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch(act){
    case "ctx": openOpts = null; push("CTX", { ctx:id }); break;
    case "cp+": push("CP", { d:+1 }); break;
    case "cp-": push("CP", { d:-1 }); break;
    case "tp+": openOpts = null; push("TP_NEXT"); break;
    case "tp-": push("TP_PREV"); break;
    case "tp-reset": openOpts = null; push("TP_RESET"); break;
    case "undo":
      while (events.length && events[events.length-1].t === "SURFACE") events.pop();
      events.pop(); save(); render();
      break;
    case "use": {
      const e = byId(id);
      if (e.options && e.options.length){ openOpts = openOpts === id ? null : id; render(); }
      else push("ACTIVATE", { id });
      break;
    }
    case "use-opt": openOpts = null; push("ACTIVATE", { id, opt:el.dataset.opt }); break;
    case "end": push("END", { id }); break;
    case "used-battle": push("USE_BATTLE", { id }); break;
    case "dismiss": push("DISMISS", { k:el.dataset.k }); break;
    case "clear-summary": push("CLEAR_SUMMARY"); break;
    case "op": push("OP", { id }); break;
    case "down": push("DOWN", { id }); break;
    case "roster": push("ROSTER", { id }); break;
    case "leader": push("LEADER", { id }); break;
    case "count+": push("COUNT", { id, d:+1 }); break;
    case "count-": push("COUNT", { id, d:-1 }); break;
    case "equip": push("EQUIP", { id }); break;
    case "tactic": push("TACTIC", { id, slot:el.dataset.slot }); break;
    case "reset": events = []; save(); render(); break;
  }
});

/* ---------------- persistence ---------------- */
const KEY = "kt-aod-log-v1";
function save(){ try { localStorage.setItem(KEY, JSON.stringify(events)); } catch(_){} }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) events = JSON.parse(raw) || []; }
  catch(_){ events = []; }
  if (!Array.isArray(events)) events = [];
}

load();
if (!events.length) $("setup").open = true;   // first run: show the roster picker
render();
</script>
