# XcodeGen spec: the Xcode project is generated from this on the CI Mac
# (xcodegen generate), so no .xcodeproj is committed.
name: KillTeam
options:
  bundleIdPrefix: io.github.kanav1
  deploymentTarget:
    iOS: "17.0"
packages:
  # The rules engine: pure Swift, also built and tested on Linux (swift test).
  KTEngine:
    path: KTEngine
settings:
  base:
    # Swift 5 language mode: Swift 6 strict-concurrency errors would each cost
    # a full CI round-trip to discover, with no local compiler to catch them.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KillTeam:
    type: application
    platform: iOS
    sources:
      - path: KillTeam
      # The rules censuses ship straight from the repo's data/ folder (one
      # source of truth), as folder references: bundle paths teams/ and core/.
      - path: ../data/teams
        type: folder
        buildPhase: resources
      - path: ../data/core
        type: folder
        buildPhase: resources
    dependencies:
      - package: KTEngine
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kanav1.killteam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: KillTeam/Info.plist
      properties:
        CFBundleDisplayName: Kill Team
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
